name: Notificação de Pull Request

# O workflow corre sempre que um PR é aberto ou reaberto
on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar comentário automático
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Olá equipa! Um novo Pull Request de Javadoc foi aberto. \n\nPor favor, verifiquem se as tags `@param` e `@return` estão corretas antes de fazer o merge! 🚀'
            })
